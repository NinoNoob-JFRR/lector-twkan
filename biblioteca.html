<!DOCTYPE html>
<html lang="es" data-theme="claro">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Mi biblioteca</title>
<style>
  :root {
    color-scheme: light;
    --fuente: 19px;
    --interlineado: 1.75;
    --ancho: 42rem;
    --familia: Georgia, "Iowan Old Style", "Times New Roman", serif;
    --alineacion: justify;
    --fondo: #f6f4ef;
    --papel: #fffdf8;
    --tinta: #1d1c1a;
    --tenue: #6b675f;
    --linea: #ddd8cd;
    --acento: #1f6feb;
    --sombra: 0 1px 3px rgba(20, 18, 14, .08);
  }
  html[data-theme="blanco"] {
    --fondo: #ffffff;
    --papel: #ffffff;
    --tinta: #111111;
    --tenue: #5f6368;
    --linea: #e3e3e3;
    --acento: #1f6feb;
  }
  html[data-theme="sepia"] {
    --fondo: #efe4cf;
    --papel: #f5ead6;
    --tinta: #3b2f21;
    --tenue: #7d6b54;
    --linea: #d8c7a8;
    --acento: #8a5a1f;
  }
  html[data-theme="oscuro"] {
    color-scheme: dark;
    --fondo: #14161a;
    --papel: #1b1e23;
    --tinta: #e6e3dc;
    --tenue: #9a9a93;
    --linea: #2c3138;
    --acento: #6ea8fe;
    --sombra: 0 1px 3px rgba(0, 0, 0, .4);
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0;
    background: var(--fondo);
    color: var(--tinta);
    font: 16px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    -webkit-text-size-adjust: 100%;
  }
  button, input, select, textarea { font: inherit; color: inherit; }
  button {
    border: 1px solid var(--linea);
    background: var(--papel);
    color: var(--tinta);
    border-radius: 9px;
    padding: 10px 14px;
    cursor: pointer;
    box-shadow: var(--sombra);
  }
  button:hover { border-color: var(--acento); }
  button.principal { background: var(--acento); border-color: var(--acento); color: white; }
  button.peligro { color: #b42318; }
  button.orden { color: var(--tenue); }
  button:disabled { opacity: .45; cursor: default; }
  input, select, textarea {
    width: 100%;
    background: var(--papel);
    border: 1px solid var(--linea);
    border-radius: 9px;
    padding: 10px 12px;
  }
  textarea { min-height: 220px; resize: vertical; line-height: 1.5; }
  a { color: var(--acento); }

  #barra {
    position: sticky;
    top: 0;
    z-index: 20;
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 10px max(12px, env(safe-area-inset-left)) 10px max(12px, env(safe-area-inset-right));
    background: var(--fondo);
    background: color-mix(in srgb, var(--fondo) 88%, transparent);
    backdrop-filter: blur(8px);
    border-bottom: 1px solid var(--linea);
  }
  #barra-titulo {
    flex: 1;
    min-width: 0;
    font-weight: 650;
    font-size: 15px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .icono {
    flex: 0 0 auto;
    min-width: 42px;
    padding: 8px 10px;
    font-size: 17px;
    line-height: 1;
  }
  #barra .icono[hidden] { display: none; }

  #progreso { position: fixed; top: 0; left: 0; right: 0; height: 3px; z-index: 30; background: transparent; }
  #progreso[hidden] { display: none; }
  #progreso-relleno { height: 100%; width: 0; background: var(--acento); transition: width .1s linear; }

  main { padding: 18px max(14px, env(safe-area-inset-left)) 110px max(14px, env(safe-area-inset-right)); }
  .contenedor { max-width: 780px; margin: 0 auto; }
  /* El lector puede ser mÃ¡s ancho que las listas: el ancho lo manda el ajuste. */
  .contenedor.lector { max-width: none; }

  h1.pequeno { font-size: 22px; margin: 6px 0 2px; }
  .sub { color: var(--tenue); font-size: 14px; margin: 0 0 18px; }

  .botones { display: flex; flex-wrap: wrap; gap: 8px; margin: 14px 0; }
  .botones button { flex: 0 1 auto; }

  .tarjetas { display: grid; gap: 12px; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); }
  .tarjeta {
    background: var(--papel);
    border: 1px solid var(--linea);
    border-radius: 14px;
    padding: 16px;
    box-shadow: var(--sombra);
    cursor: pointer;
    text-align: left;
    display: flex;
    flex-direction: column;
    gap: 6px;
  }
  .tarjeta strong { font-size: 17px; line-height: 1.25; }
  .tarjeta span { color: var(--tenue); font-size: 13px; }

  .lista { background: var(--papel); border: 1px solid var(--linea); border-radius: 14px; overflow: hidden; }
  .fila {
    display: flex;
    align-items: center;
    gap: 12px;
    width: 100%;
    padding: 13px 15px;
    border: 0;
    border-bottom: 1px solid var(--linea);
    border-radius: 0;
    background: transparent;
    box-shadow: none;
    text-align: left;
    cursor: pointer;
  }
  .fila:last-child { border-bottom: 0; }
  .fila:hover { background: color-mix(in srgb, var(--acento) 7%, transparent); }
  .fila .num { color: var(--tenue); font-variant-numeric: tabular-nums; min-width: 3.2em; font-size: 13px; }
  .fila .titulo { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .fila .marca { font-size: 12px; color: var(--tenue); }
  .fila.leido .titulo { color: var(--tenue); }
  .fila.leido { opacity: .6; background: color-mix(in srgb, #1a7f37 10%, transparent); }
  .fila.leido .marca { color: #1a7f37; font-weight: 600; }
  .borrar-cap {
    flex: 0 0 auto;
    min-width: 36px;
    width: 36px;
    height: 36px;
    border: 1px solid var(--linea);
    background: var(--papel);
    color: #b42318;
    border-radius: 7px;
    cursor: pointer;
    font-size: 17px;
    line-height: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 0;
  }
  .borrar-cap:hover { background: color-mix(in srgb, #b42318 12%, var(--papel)); border-color: #b42318; }
  .borrar-cap:active { background: color-mix(in srgb, #b42318 20%, var(--papel)); }

  .vacio {
    text-align: center;
    color: var(--tenue);
    padding: 40px 18px;
    border: 1px dashed var(--linea);
    border-radius: 14px;
  }
  .vacio h2 { color: var(--tinta); font-size: 18px; margin: 0 0 8px; }
  .vacio p { margin: 8px 0; font-size: 14px; }

  #lector {
    max-width: var(--ancho);
    margin: 0 auto;
    font-family: var(--familia);
    font-size: var(--fuente);
    line-height: var(--interlineado);
    text-align: var(--alineacion);
    overflow-wrap: break-word;
    word-break: normal;
    hyphens: none;
  }
  #lector h2 { font-family: system-ui, sans-serif; font-size: 1.05em; text-align: left; color: var(--tenue); font-weight: 600; margin: 0 0 1.2em; }
  #lector p { margin: 0 0 .9em; }
  #lector.raya p { text-indent: 1.4em; margin-bottom: .45em; }

  #nav-lector {
    position: fixed;
    left: 0;
    right: 0;
    bottom: 0;
    z-index: 25;
    display: flex;
    gap: 8px;
    padding: 10px max(10px, env(safe-area-inset-left)) calc(10px + env(safe-area-inset-bottom)) max(10px, env(safe-area-inset-right));
    background: var(--fondo);
    background: color-mix(in srgb, var(--fondo) 92%, transparent);
    backdrop-filter: blur(8px);
    border-top: 1px solid var(--linea);
  }
  #nav-lector[hidden] { display: none; }
  #nav-lector button { flex: 1; }
  #nav-lector #indice { flex: .8; }

  #modal {
    position: fixed;
    inset: 0;
    z-index: 40;
    background: rgba(0, 0, 0, .5);
    display: flex;
    align-items: flex-end;
    justify-content: center;
    padding: 0;
  }
  #modal[hidden] { display: none; }
  #modal-caja {
    background: var(--papel);
    width: 100%;
    max-width: 620px;
    max-height: 92vh;
    overflow: auto;
    border-radius: 18px 18px 0 0;
    padding: 18px 18px calc(18px + env(safe-area-inset-bottom));
  }
  @media (min-width: 700px) {
    #modal { align-items: center; padding: 20px; }
    #modal-caja { border-radius: 18px; }
  }
  #modal-caja h2 { margin: 0 0 4px; font-size: 19px; }
  #modal-caja .pista { color: var(--tenue); font-size: 13px; margin: 0 0 14px; }
  .campo { margin: 12px 0; }
  .campo label { display: block; font-size: 13px; color: var(--tenue); margin-bottom: 5px; }
  .fila-campos { display: flex; gap: 10px; flex-wrap: wrap; }
  .fila-campos > .campo { flex: 1 1 160px; }

  .dividir {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 8px 10px;
    margin: 12px 0;
  }
  .dividir select { width: auto; min-width: 150px; }

  /* Estado de Firebase en la barra */
  #estado-firebase { font-size: 17px; line-height: 1; padding: 8px 10px; }
  #estado-firebase.conectado { color: #1a7f37; }
  #estado-firebase.desconectado { color: #b42318; }
  #estado-firebase.sincronizando { color: #1f6feb; animation: pulso 1.5s infinite; }
  @keyframes pulso { 0%, 100% { opacity: 1; } 50% { opacity: .5; } }

  #aviso {
    position: fixed;
    left: 50%;
    bottom: 86px;
    transform: translateX(-50%);
    z-index: 50;
    margin: 0;
    max-width: min(92vw, 480px);
    padding: 11px 16px;
    border-radius: 999px;
    background: #1f6feb;
    color: white;
    font-size: 14px;
    box-shadow: 0 6px 20px rgba(0, 0, 0, .25);
  }
  #aviso[hidden] { display: none; }

  .ajuste { margin: 16px 0; }
  .ajuste label { display: flex; justify-content: space-between; font-size: 13px; color: var(--tenue); margin-bottom: 6px; }
  .ajuste input[type="range"] { width: 100%; accent-color: var(--acento); }
  .opciones { display: flex; gap: 8px; flex-wrap: wrap; }
  .opciones button { flex: 1 1 auto; }
  .opciones button.activo { border-color: var(--acento); background: color-mix(in srgb, var(--acento) 14%, var(--papel)); }

  .meta { color: var(--tenue); font-size: 13px; }
  .separador { border: 0; border-top: 1px solid var(--linea); margin: 18px 0; }
</style>
</head>
<body>

<header id="barra">
  <button id="btn-atras" class="icono" title="AtrÃ¡s" hidden>â†</button>
  <div id="barra-titulo">Mi biblioteca</div>
  <div id="estado-firebase" class="icono" title="Estado de la nube" hidden>â˜</div>
  <button id="btn-ajustes" class="icono" title="Ajustes de lectura">Aa</button>
  <button id="btn-editar-cap" class="icono" title="editar capÃ­tulo" hidden>âœŽ</button>
</header>

<div id="progreso" hidden><div id="progreso-relleno"></div></div>

<main id="vista"><div class="contenedor"></div></main>

<nav id="nav-lector" hidden>
  <button id="ant">â€¹ Anterior</button>
  <button id="indice">Ãndice</button>
  <button id="sig">Siguiente â€º</button>
</nav>

<div id="modal" hidden><div id="modal-caja"></div></div>
<p id="aviso" hidden></p>

<script>
  // Firebase (opcional: si falla, la biblioteca sigue funcionando solo local)
  let fbDb = null;
  let firebaseListo = false;
  let firebaseError = null;
  try {
    const firebaseConfig = {
      apiKey: "AIzaSyDP0GORVPDq0JiRvKTIsuZfC0zZK7OjWE4",
      authDomain: "mi-biblioteca-novelas.firebaseapp.com",
      projectId: "mi-biblioteca-novelas",
      storageBucket: "mi-biblioteca-novelas.firebasestorage.app",
      messagingSenderId: "992048920246",
      appId: "1:992048920246:web:0b593d969769c158c4d817"
    };
    firebase.initializeApp(firebaseConfig);
    fbDb = firebase.firestore();
    firebaseListo = true;
  } catch (e) {
    firebaseError = e.message || String(e);
  }

  async function fbGuardarnovela(novela) {
    if (!firebaseListo) return;
    try { await fbDb.collection('novelas').doc(novela.id).set(novela); } catch (e) { console.warn('Firebase novela:', e); }
  }
  async function fbGuardarCapitulo(capitulo) {
    if (!firebaseListo) return;
    try { await fbDb.collection('capitulos').doc(capitulo.id).set(capitulo); } catch (e) { console.warn('Firebase capÃ­tulo:', e); }
  }
  async function fbCargarnovelas() {
    if (!firebaseListo) return [];
    try {
      const snap = await fbDb.collection('novelas').get();
      return snap.docs.map(d => d.data());
    } catch (e) { console.warn('Firebase cargar novelas:', e); return []; }
  }
  async function fbCargarCapitulos() {
    if (!firebaseListo) return [];
    try {
      const snap = await fbDb.collection('capitulos').get();
      return snap.docs.map(d => d.data());
    } catch (e) { console.warn('Firebase cargar capÃ­tulos:', e); return []; }
  }

  async function sincronizarDesdeFirebase() {
    if (!firebaseListo) return;
    estadoFirebaseElTemp.classList.add('sincronizando');
    try {
      const novelasFb = await fbCargarnovelas();
      const capitulosFb = await fbCargarCapitulos();
      let nuevas = 0;
      for (const n of novelasFb) {
        const existente = await dbVer('novelas', n.id);
        if (!existente || (n.actualizado || 0) > (existente.actualizado || 0)) {
          await dbPoner('novelas', n);
          nuevas += 1;
        }
      }
      for (const c of capitulosFb) {
        const existente = await dbVer('capitulos', c.id);
        if (!existente || (c.actualizado || 0) > (existente.actualizado || 0)) {
          await dbPoner('capitulos', c);
          nuevas += 1;
        }
      }
      if (nuevas > 0) { aviso(nuevas + ' elemento' + (nuevas === 1 ? '' : 's') + ' sincronizado' + (nuevas === 1 ? '' : 's') + ' desde la nube'); }
    } catch (e) { console.warn('Sync Firebase:', e); }
    estadoFirebaseEl.classList.remove('sincronizando');
    actualizarEstadoFirebaseEl();
  }

  // Sube TODO lo que tengas local a Firebase (novelas y capÃ­tulos).
  // Ãšsalo si creaste capÃ­tulos en otra ventana o en incÃ³gnito y no subieron.
  async function subirTodoAFirebase() {
    if (!firebaseListo) { aviso('Firebase no disponible'); return; }
    try {
      const novelas = await dbTodo('novelas');
      const capitulos = await dbTodo('capitulos');
      let subidas = 0;
      for (const n of novelas) {
        await fbGuardarnovela(n);
        subidas += 1;
      }
      for (const c of capitulos) {
        await fbGuardarCapitulo(c);
        subidas += 1;
      }
      aviso(subidas + ' elemento' + (subidas === 1 ? '' : 's') + ' subido' + (subidas === 1 ? '' : 's') + ' a la nube');
    } catch (e) {
      console.warn('subir a Firebase:', e);
      aviso('Error subiendo a la nube');
    }
  }

  function actualizarEstadoFirebaseEl() {
    if (!estadoFirebaseEl) { return; }
    estadoFirebaseEl.hidden = false;
    if (!firebaseListo) {
      estadoFirebaseEl.textContent = 'â˜';
      estadoFirebaseEl.className = 'desconectado';
      estadoFirebaseEl.title = 'Sin conexiÃ³n a la nube: ' + (firebaseError || 'error desconocido');
    } else {
      estadoFirebaseEl.textContent = 'â˜';
      estadoFirebaseEl.className = 'conectado';
      estadoFirebaseEl.title = 'Conectado a Firebase (nube)';
    }
  }

  (function () {
    'use strict';

  // ------------------------------------------------------------------ ajustes
  const CLAVE_AJUSTES = 'biblioteca.ajustes.v1';
  const AJUSTES_BASE = {
    fuente: 19,
    interlineado: 1.75,
    ancho: 42,
    tema: 'claro',
    justificado: true,
    raya: false,
    serif: true,
    separar: 'auto'
  };
  let ajustes = Object.assign({}, AJUSTES_BASE, leerJSON(CLAVE_AJUSTES, {}));

  function leerJSON(clave, porDefecto) {
    try {
      const raw = localStorage.getItem(clave);
      return raw ? JSON.parse(raw) : porDefecto;
    } catch (e) {
      return porDefecto;
    }
  }
  function guardarJSON(clave, valor) {
    try { localStorage.setItem(clave, JSON.stringify(valor)); } catch (e) { /* sin almacenamiento */ }
  }
  guardarJSON(CLAVE_AJUSTES, ajustes);

  function aplicarAjustes() {
    const raiz = document.documentElement;
    raiz.dataset.theme = ajustes.tema;
    raiz.style.setProperty('--fuente', ajustes.fuente + 'px');
    raiz.style.setProperty('--interlineado', String(ajustes.interlineado));
    raiz.style.setProperty('--ancho', ajustes.ancho + 'rem');
    raiz.style.setProperty('--familia', ajustes.serif
      ? 'Georgia, "Iowan Old Style", "Times New Roman", serif'
      : 'system-ui, -apple-system, "Segoe UI", Roboto, sans-serif');
    raiz.style.setProperty('--alineacion', ajustes.justificado ? 'justify' : 'left');
    const caja = document.getElementById('lector');
    if (caja) { caja.classList.toggle('raya', ajustes.raya); }
  }

  // --------------------------------------------------------------- IndexedDB
  const DB_NOMBRE = 'bibliotecanovelas';
  const DB_VERSION = 1;
  let dbPromesa = null;

  function abrirDB() {
    if (dbPromesa) { return dbPromesa; }
    dbPromesa = new Promise((resolver, rechazar) => {
      if (!window.indexedDB) { rechazar(new Error('Este navegador no permite guardar datos.')); return; }
      const peticion = indexedDB.open(DB_NOMBRE, DB_VERSION);
      peticion.onupgradeneeded = () => {
        const db = peticion.result;
        if (!db.objectStoreNames.contains('novelas')) {
          db.createObjectStore('novelas', { keyPath: 'id' });
        }
        if (!db.objectStoreNames.contains('capitulos')) {
          const almacen = db.createObjectStore('capitulos', { keyPath: 'id' });
          almacen.createIndex('novelaId', 'novelaId');
        }
        if (!db.objectStoreNames.contains('meta')) {
          db.createObjectStore('meta', { keyPath: 'k' });
        }
      };
      peticion.onsuccess = () => resolver(peticion.result);
      peticion.onerror = () => rechazar(peticion.error);
    });
    return dbPromesa;
  }

  function tx(almacen, modo, accion) {
    return abrirDB().then((db) => new Promise((resolver, rechazar) => {
      const transaccion = db.transaction(almacen, modo);
      const objeto = transaccion.objectStore(almacen);
      let peticion;
      try { peticion = accion(objeto); } catch (error) { rechazar(error); return; }
      transaccion.oncomplete = () => {
        // getAll() y get() devuelven una peticion: hay que resolver su resultado.
        if (peticion && typeof peticion === 'object' && 'result' in peticion) {
          resolver(peticion.result);
        } else {
          resolver(peticion);
        }
      };
      transaccion.onerror = () => rechazar(transaccion.error);
      transaccion.onabort = () => rechazar(transaccion.error);
    }));
  }

  const dbTodo = (almacen) => tx(almacen, 'readonly', (o) => o.getAll());
  const dbVer = (almacen, clave) => tx(almacen, 'readonly', (o) => o.get(clave));
  const dbPoner = async (almacen, valor) => {
    const resultado = tx(almacen, 'readwrite', (o) => o.put(valor));
    // Firebase no bloquea la escritura local: se dispara y se olvida
    if (almacen === 'novelas') { fbGuardarnovela(valor).catch(e => console.warn('Firebase novela:', e)); }
    if (almacen === 'capitulos') { fbGuardarCapitulo(valor).catch(e => console.warn('Firebase capÃ­tulo:', e)); }
    return resultado;
  };
  const dbBorrar = (almacen, clave) => tx(almacen, 'readwrite', (o) => o.delete(clave));

  function capitulosDe(novelaId) {
    return abrirDB().then((db) => new Promise((resolver, rechazar) => {
      const indice = db.transaction('capitulos', 'readonly').objectStore('capitulos').index('novelaId');
      const peticion = indice.getAll(novelaId);
      peticion.onsuccess = () => resolver(peticion.result);
      peticion.onerror = () => rechazar(peticion.error);
    }));
  }

  const nuevoId = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 8);

  // Extrae el nÃºmero de un nombre de archivo (ej. "417.txt" -> 417, "capitulo 440.txt" -> 440).
  // Devuelve null si no hay nÃºmero (para notas del autor, etc.).
  function extraerNumeroDeNombre(nombre) {
    const base = String(nombre || '').replace(/\.txt$/i, '');
    const m = base.match(/(\d+)/);
    return m ? Number(m[1]) : null;
  }

  // NÃºmero usado para marcar capÃ­tulos sin nÃºmero real (notas del autor, etc.).
  // Siempre se ordenan al final, sin importar cuÃ¡ndo se importen.
  const NUM_SIN_NUMERO = 999999;

  function esCapituloSinNumero(c) {
    const n = numeroDe(c);
    return n !== null && n >= NUM_SIN_NUMERO;
  }

  // ------------------------------------------------------------------ estado
  const estado = { novela: null, capitulo: null, capitulos: [], novelas: [], orden: 'asc' };

  function capituloDeTitulo(titulo) {
    const t = String(titulo || '');
    let m = t.match(/ç¬¬\s*([0-9ï¼-ï¼™]+)\s*[ç« èŠ‚å›žå·]/);
    if (!m) { m = t.match(/cap[iÃ­]tulo\s+([0-9]+)/i); }
    return m ? Number(m[1].replace(/[ï¼-ï¼™]/g, (d) => String('ï¼ï¼‘ï¼’ï¼“ï¼”ï¼•ï¼–ï¼—ï¼˜ï¼™'.indexOf(d)))) : null;
  }

  function numeroDe(c) {

  function compararCapitulos(a, b) {

    if (ca !== cb) { return ca - cb; }

  async function pintarLector(novelaId, capituloId) {
    const novela = await dbVer('novelas', novelaId);
    const capitulo = await dbVer('capitulos', capituloId);
    if (!novela || !capitulo) { ir('#/'); return; }
    estado.novela = novela;
    estado.capitulo = capitulo;
    estado.novelaId = novelaId;

    const capitulos = (await capitulosDe(novelaId)).sort(compararCapitulos);
    estado.capitulos = capitulos;
    const indice = capitulos.findIndex((c) => c.id === capituloId);

    barraTitulo.textContent = capitulo.titulo || novela.titulo;
    btnAtras.hidden = false;
    navLector.hidden = false;
    btneditarCap.hidden = false;
    barraProgreso.hidden = false;
    document.getElementById('ant').disabled = indice <= 0;
    document.getElementById('sig').disabled = indice < 0 || indice >= capitulos.length - 1;

    const parrafos = separarParrafos(capitulo.texto || '');
    // El tÃ­tulo suele repetirse en la primera lÃ­nea al pegar: no se pinta dos veces.
    if (parrafos.length && capitulo.titulo
        && normalizar(parrafos[0]) === normalizar(capitulo.titulo)) {
      parrafos.shift();
    }

    let html = '<article id="lector"><h2>' + escapar(capitulo.titulo || '') + '</h2>';
    for (const parrafo of parrafos) {
      html += '<p>' + parrafo.split('\n').map(escapar).join('<br>') + '</p>';
    }
    html += '</article>';

    const cajaLector = vista.querySelector('.contenedor');
    cajaLector.className = 'contenedor lector';
    cajaLector.innerHTML = html;
    aplicarAjustes();

    // Restaurar la posiciÃ³n de lectura de este capÃ­tulo.
    requestAnimationFrame(() => {
      const alto = document.documentElement.scrollHeight - window.innerHeight;
      if (alto > 0 && capitulo.pos > 0) {
        window.scrollTo(0, Math.round(alto * Math.min(capitulo.pos, 1)));
      } else {
        window.scrollTo(0, 0);
      }
      actualizarBarraProgreso();
    });

    let temporizador = null;
    const guardarPosicion = () => {
      const alto = document.documentElement.scrollHeight - window.innerHeight;
      const proporcion = alto > 0 ? Math.min(window.scrollY / alto, 1) : 1;
      actualizarBarraProgreso();
      clearTimeout(temporizador);
      temporizador = setTimeout(async () => {
        if (!estado.capitulo) { return; }
        const actualizado = Object.assign({}, estado.capitulo, {
          pos: proporcion,
          leido: proporcion > 0.92 || estado.capitulo.leido,
          actualizado: Date.now()
        });
        estado.capitulo = actualizado;
        await dbPoner('capitulos', actualizado);
        await dbPoner('meta', { k: 'ultimo', novelaId: novelaId, capituloId: actualizado.id, cuando: Date.now() });
        // Cada novela recuerda su ultimo capÃ­tulo para su boton continuar.
        const novela = await dbVer('novelas', novelaId);
        if (novela && novela.ultimoCapId !== actualizado.id) {
          await dbPoner('novelas', Object.assign({}, novela, {
            ultimoCapId: actualizado.id,
            actualizado: Date.now()
          }));
        }
      }, 350);
    };
    window.onscroll = guardarPosicion;
    guardarPosicion();
  }

  function actualizarBarraProgreso() {
    const alto = document.documentElement.scrollHeight - window.innerHeight;
    const proporcion = alto > 0 ? Math.min(window.scrollY / alto, 1) : 1;
    rellenoProgreso.style.width = (proporcion * 100).toFixed(1) + '%';

  function separarParrafos(texto) {
    const limpio = String(texto || '').replace(/\r\n?/g, '\n');
    // Lo normal es un parrafo por bloque separado por linea en blanco. Si el
    // texto pegado no trae ninguna linea en blanco, cada salto es un parrafo.
    const cortes = /\n{2,}/.test(limpio) ? /\n{2,}/ : /\n/;
    return limpio
      .split(cortes)
      .map((p) => p.replace(/^[ \t]+|[ \t]+$/g, ''))
      .filter((p) => p.length > 0);
  }

  function normalizar(texto) {
    return String(texto || '').replace(/\s+/g, '').toLowerCase();
  }

  function recortar(texto, maximo) {
    const limpio = String(texto || '');
    return limpio.length > maximo ? limpio.slice(0, maximo - 1) + 'â€¦' : limpio;
  }

  function siguienteNumero(capitulos) {

  function leerArchivo(archivo) {
    return new Promise((resolver, rechazar) => {
      const lector = new FileReader();
      lector.onload = () => resolver(String(lector.result || ''));
      lector.onerror = () => rechazar(lector.error);
      lector.readAsText(archivo, 'utf-8');
    });
  }

  function normalizartexto(texto) {
    return String(texto || '').replace(/\s+/g, ' ').trim();
  }

  // Dos capitulos con el mismo texto son el mismo capitulo: si ya existe, no se
  // vuelve a meter. Esto es lo que hacia que se duplicaran al subir de nuevo.
  function indiceDetextos(capitulos) {
    const mapa = new Map();
    for (const c of capitulos) {
      const clave = normalizartexto(c.texto);
      if (!mapa.has(clave)) { mapa.set(clave, c); }
    }
    return mapa;
  }

  // Separa un txt en capÃ­tulos usando encabezados reconocibles.
  // modo: 'auto' (encabezados reconocibles y separadores ===/---),
  // 'capitulo' (solo Â«CapÃ­tulo NÂ» o Â«ç¬¬Nç« Â» en su propia lÃ­nea).
  function dividirEnCapitulos(texto, modo = 'auto') {
    const lineas = String(texto || '').replace(/\r\n?/g, '\n').split('\n');
    const marcas = [];
    lineas.forEach((linea, indice) => {
      const limpia = linea.trim();
      if (!limpia) { return; }
      if (modo === 'auto' && patronTitulo(limpia)) {
        marcas.push({ indice, titulo: limpia.replace(/^[=#*\s]+|[=#*\s]+$/g, '') });
        return;
      }
      if (modo === 'capitulo') {
        const m = /^cap[iÃ­]tulo\s+([0-9]+)\b(.{0,60})$/i.exec(limpia);
        if (m) { marcas.push({ indice, titulo: limpia }); return; }
      }
      if (modo === 'auto' || modo === 'capitulo') {
        const separador = /^(?:={2,}|#{2,}|-{3,})\s*(?:cap[iÃ­]tulo\s*[0-9]*\s*[:Â·-]?\s*)?(.*?)\s*(?:={2,}|#{2,}|-{3,})$/.exec(limpia);
        if (separador) { marcas.push({ indice, titulo: separador[1].trim() }); }
      }
    });
    if (marcas.length < 1) {
      return [{ titulo: '', texto: String(texto || '').trim() }];
    }
    const partes = [];
    // Un prologo antes del primer encabezado se conserva, pero solo si es texto
    // de verdad: el titulo y el autor del archivo exportado son dos lineas.
    const previo = lineas.slice(0, marcas[0].indice).join('\n').trim();
    if (previo.length > 400) { partes.push({ titulo: '', texto: previo }); }
    for (let i = 0; i < marcas.length; i += 1) {
      const desde = marcas[i].indice + 1;
      const hasta = i + 1 < marcas.length ? marcas[i + 1].indice : lineas.length;
      const cuerpo = lineas.slice(desde, hasta).join('\n').trim();
      if (cuerpo) { partes.push({ titulo: marcas[i].titulo, texto: cuerpo }); }
    }
    return partes.length ? partes : [{ titulo: '', texto: String(texto || '').trim() }];
  }

  // ------------------------------------------------------------------ exportar
  function Descargar(nombre, contenido) {
    const blob = new Blob([contenido], { type: 'text/plain;charset=utf-8' });
    const url = URL.createObjectURL(blob);
    const enlace = document.createElement('a');
    enlace.href = url;
    enlace.download = nombre;
    document.body.appendChild(enlace);
    enlace.click();
    enlace.remove();
    setTimeout(() => URL.revokeObjectURL(url), 4000);
  }

  function nombreSeguro(texto) {
    return String(texto || 'sin-titulo').replace(/[\\/:*?"<>|]+/g, '-').replace(/\s+/g, ' ').trim().slice(0, 80);
  }

  function textoDeCapitulo(novela, capitulo) {
    const titulo = (capitulo.num ? String(capitulo.num).padStart(3, '0') + ' Â· ' : '') + (capitulo.titulo || '');
    return titulo + '\n\n' + (capitulo.texto || '').trim() + '\n';
  }

  function DescargarCapitulo(capitulo, novela) {
    const nombre = nombreSeguro((novela ? novela.titulo + ' - ' : '') + textoDeCapitulo(novela, capitulo).split('\n')[0]) + '.txt';
    Descargar(nombre, textoDeCapitulo(novela, capitulo));
  }

    let texto = novela.titulo + (novela.autor ? ' â€” ' + novela.autor : '') + '\n\n';
    for (const c of capitulos) {
      texto += '\n\n=== CapÃ­tulo ' + (c.num || '') + ': ' + (c.titulo || '') + ' ===\n\n';
      texto += (c.texto || '').trim() + '\n';
    }
    Descargar(nombreSeguro(novela.titulo) + '.txt', texto);
    aviso('novela exportada');
  }

    document.getElementById('co-cancelar').addEventListener('click', cerrarModal);
    document.getElementById('co-exportar').addEventListener('click', async () => {
      const copia = {
        app: 'biblioteca-novelas',
        version: 1,
        exportado: Date.now(),
        novelas: await dbTodo('novelas'),
        capitulos: await dbTodo('capitulos'),
        meta: await dbTodo('meta'),
        ajustes: ajustes
      };
      Descargar('biblioteca-' + new Date().toISOString().slice(0, 10) + '.json', JSON.stringify(copia, null, 2));
      aviso('Copia Descargada');
    });
    document.getElementById('co-importar').addEventListener('click', async () => {
      const archivo = (document.getElementById('co-archivo').files || [])[0];
      if (!archivo) { aviso('Elige un archivo .json'); return; }
      try {
        const copia = JSON.parse(await leerArchivo(archivo));
        const novelas = Array.isArray(copia.novelas) ? copia.novelas : [];
        const capitulos = Array.isArray(copia.capitulos) ? copia.capitulos : [];
        let nuevas = 0;
        let nuevosCaps = 0;
        for (const n of novelas) {
          if (!n || !n.id) { continue; }
          if (!(await dbVer('novelas', n.id))) { await dbPoner('novelas', n); nuevas += 1; }
        }
        for (const c of capitulos) {
          if (!c || !c.id || !c.novelaId) { continue; }
          if (!(await dbVer('capitulos', c.id))) { await dbPoner('capitulos', c); nuevosCaps += 1; }
        }
        for (const m of (Array.isArray(copia.meta) ? copia.meta : [])) {
          if (!m || !m.k) { continue; }
          if (!(await dbVer('meta', m.k))) { await dbPoner('meta', m); }
        }
        cerrarModal();
        aviso('Restauradas ' + nuevas + ' novelas y ' + nuevosCaps + ' capÃ­tulos');
        render();
      } catch (error) {
        aviso('El archivo no es una copia vÃ¡lida');
      }
    });
  }

  // ------------------------------------------------------------ ajustes lectura
  function dialogoAjustes() {
    abrirModal(`
      <h2>Ajustes de lectura</h2>
      <div class="ajuste">
        <label>TamaÃ±o de letra <span id="v-fuente">${ajustes.fuente}px</span></label>
        <input id="a-fuente" type="range" min="15" max="30" step="1" value="${ajustes.fuente}">
      </div>
      <div class="ajuste">
        <label>Interlineado <span id="v-interlineado">${ajustes.interlineado}</span></label>
        <input id="a-interlineado" type="range" min="1.3" max="2.2" step="0.05" value="${ajustes.interlineado}">
      </div>
      <div class="ajuste">
        <label>Ancho del texto <span id="v-ancho">${ajustes.ancho} rem</span></label>
        <input id="a-ancho" type="range" min="20" max="100" step="1" value="${ajustes.ancho}">
      </div>
      <div class="ajuste">
        <label>Tema</label>
        <div class="opciones" id="a-tema">
          <button data-tema="claro" class="${ajustes.tema === 'claro' ? 'activo' : ''}">Claro</button>
          <button data-tema="blanco" class="${ajustes.tema === 'blanco' ? 'activo' : ''}">Blanco</button>
          <button data-tema="sepia" class="${ajustes.tema === 'sepia' ? 'activo' : ''}">Sepia</button>
          <button data-tema="oscuro" class="${ajustes.tema === 'oscuro' ? 'activo' : ''}">Oscuro</button>
        </div>
      </div>
      <div class="ajuste">
        <label>Fuente</label>
        <div class="opciones" id="a-fuente-tipo">
          <button data-serif="1" class="${ajustes.serif ? 'activo' : ''}">Con serifa (libro)</button>
          <button data-serif="0" class="${!ajustes.serif ? 'activo' : ''}">Sin serifa</button>
        </div>
      </div>
      <div class="ajuste">
        <label>texto</label>
        <div class="opciones">
          <button id="a-justificado" class="${ajustes.justificado ? 'activo' : ''}">Justificado</button>
          <button id="a-raya" class="${ajustes.raya ? 'activo' : ''}">SangrÃ­a de pÃ¡rrafo</button>
        </div>
      </div>
      <div class="botones">
        <button class="principal" id="a-cerrar">Listo</button>
      </div>
    `);
    const guardar = () => { guardarJSON(CLAVE_AJUSTES, ajustes); aplicarAjustes(); };
    document.getElementById('a-fuente').addEventListener('input', (e) => {
      ajustes.fuente = Number(e.target.value);
      document.getElementById('v-fuente').textContent = ajustes.fuente + 'px';
      guardar();
    });
    document.getElementById('a-interlineado').addEventListener('input', (e) => {
      ajustes.interlineado = Number(e.target.value);
      document.getElementById('v-interlineado').textContent = ajustes.interlineado.toFixed(2);
      guardar();
    });
    document.getElementById('a-ancho').addEventListener('input', (e) => {
      ajustes.ancho = Number(e.target.value);
      document.getElementById('v-ancho').textContent = ajustes.ancho + ' rem';
      guardar();
    });
    document.querySelectorAll('#a-tema button').forEach((boton) => {
      boton.addEventListener('click', () => {
        ajustes.tema = boton.dataset.tema;
        document.querySelectorAll('#a-tema button').forEach((b) => b.classList.toggle('activo', b === boton));
        guardar();
      });
    });
    document.querySelectorAll('#a-fuente-tipo button').forEach((boton) => {
      boton.addEventListener('click', () => {
        ajustes.serif = boton.dataset.serif === '1';
        document.querySelectorAll('#a-fuente-tipo button').forEach((b) => b.classList.toggle('activo', b === boton));
        guardar();
      });
    });
    document.getElementById('a-justificado').addEventListener('click', (e) => {
      ajustes.justificado = !ajustes.justificado;
      e.currentTarget.classList.toggle('activo', ajustes.justificado);
      guardar();
    });
    document.getElementById('a-raya').addEventListener('click', (e) => {
      ajustes.raya = !ajustes.raya;
      e.currentTarget.classList.toggle('activo', ajustes.raya);
      guardar();
    });
    document.getElementById('a-cerrar').addEventListener('click', cerrarModal);
  }

  // -------------------------------------------------------------- navegaciÃ³n
  try {
    btnAtras.addEventListener('click', () => {
      const ruta = rutaActual();
      if (ruta.vista === 'lector') { ir('#/n/' + ruta.novelaId); return; }
      if (ruta.vista === 'novela') { ir('#/'); return; }
      history.back();
    });

    btnAjustes.addEventListener('click', dialogoAjustes);

    btneditarCap.addEventListener('click', () => {
      if (estado.novela && estado.capitulo) {
        dialogoCapitulo(estado.novela.id, estado.capitulo);
      }
    });

    document.getElementById('ant').addEventListener('click', () => {
      const ruta = rutaActual();
      if (ruta.vista !== 'lector') { return; }
      const indice = estado.capitulos.findIndex((c) => c.id === ruta.capituloId);
      if (indice > 0) { ir('#/n/' + ruta.novelaId + '/c/' + estado.capitulos[indice - 1].id); }
    });
    document.getElementById('sig').addEventListener('click', () => {
      const ruta = rutaActual();
      if (ruta.vista !== 'lector') { return; }
      const indice = estado.capitulos.findIndex((c) => c.id === ruta.capituloId);
      if (indice >= 0 && indice < estado.capitulos.length - 1) {
        ir('#/n/' + ruta.novelaId + '/c/' + estado.capitulos[indice + 1].id);
      }
    });
    document.getElementById('indice').addEventListener('click', () => {
      const ruta = rutaActual();
      if (ruta.vista === 'lector') { ir('#/n/' + ruta.novelaId); }
    });

    window.addEventListener('hashchange', () => {
      if (rutaActual().vista !== 'lector') { window.onscroll = null; }
    });
  } catch (e) {
    console.error('Error asignando eventos de navegaciÃ³n:', e);
  }

  aplicarAjustes();
  render();
})();
</script>
